[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-tree-attention"
version = "0.1.0"
description = "Cube-aligned scheduling for tree-shared decode attention"
requires-python = ">=3.11"
dependencies = ["torch>=2.9", "numpy", "transformers>=4.57", "safetensors", "huggingface_hub"]

[project.optional-dependencies]
plots = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
